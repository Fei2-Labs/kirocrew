# Upstream-sync manifest for the Fei2-Labs/kirocrew fork of kirodotdev/KiroCrew.
# Procedure: the `fork-upstream-sync` skill. Driver: scripts/sync-upstream.sh.
#
# This file is the fork's MEMORY. Every sync that teaches something adds an entry.
# Derived from AGENTS.md, the CI gate scripts, and .trellis/handoffs/INDEX.md's
# durable-decisions list.

upstream:
  remote: upstream
  url: https://github.com/kirodotdev/KiroCrew.git
  branch: main
  fork_branch: main
  sync_branch: "sync/upstream-{date}"

conflict_policy:
  # ── keystone security surfaces: the fork's hardening is the point ──
  - glob: "src/kiro_crew/security.py"
    policy: fork_wins
    keystone: true
    note: |
      Keep _SENSITIVE_HOME_DIRS coverage, the _win_segment quirk-tolerant Windows
      matcher (#5265), _PROTECTED_BRANCHES, and AKIA/ASIA redaction. Both sides
      routinely ADD entries to _CREW_SECRET_LEAVES / _SENSITIVE_HOME_DIRS — take
      the UNION of entries while keeping the fork's matcher implementation.

  - glob: "src/kiro_crew/@(sandbox|hooks|name_grant|session_pid).py"
    policy: fork_wins
    keystone: true
    note: |
      sandbox.py: keep BOTH sandboxed_spawn_argv_off_loop (3 call sites depend on
      it by name) and shielded_prepare_off_loop. name_grant.py: upstream's
      hardening here is usually a strict superset — prefer it, it over-refuses
      which is the safe direction.

  - glob: "src/kiro_crew/dashboard/chat_runner.py"
    policy: fork_wins
    keystone: true
    note: |
      NEVER let configured_auto_approve return as a grant source (see
      divergences/auth-grant-sources). Watch for the merge duplicating
      _name_grant_refusal_off_loop — keep the platform-aware copy.

  - glob: "src/kiro_crew/acp/types.py"
    policy: fork_wins
    keystone: true
    note: "ACP_BACKENDS_SELECTABLE carries the fork's admitted adapters."

  - glob: "src/kiro_crew/config/loader.py"
    policy: fork_wins
    keystone: true
    note: "agent.provider stays enum=['acp']; CONTRACT_VERSION pinned at 1."

  - glob: "src/kiro_crew/acp/@(client|runtime|_dispatch|session_handle).py"
    policy: fork_wins
    keystone: true
    note: |
      Carries the fc48cd48a MCP-injection divergence (_session_mcp_servers must
      COMPOSE with upstream's acp/spec_servers.py, never duplicate it) plus the
      opencode/copilot spawn+handshake wiring. Adopt upstream's structure where
      it does not touch those two things.

  # ── operator-local config: the fork's own values, not upstream's ──
  - glob: ".kiro/settings/cli.json"
    policy: fork_wins
    note: "Local ACP/model configuration for this install."

  # ── CI workflows: take upstream; dependabot re-bumps action versions ──
  - glob: ".github/workflows/**"
    policy: upstream_wins
    note: |
      The only fork-side edits here are dependabot action-version bumps, which
      dependabot re-opens if the merge drops them. Do NOT hand-carry them.
      EXCEPT sync-upstream.yml, which is fork-only (see the next rule).
  - glob: ".github/workflows/sync-upstream.yml"
    policy: fork_wins
    note: "Fork-only: upstream has no such workflow."

  # ── fork-only exemption lists: both sides append entries ──
  - glob: "website/.jscpd.json"
    policy: union
    note: "Fork adds its own capture-harness exemptions; upstream adds others."

  - glob: "website/scripts/check-bundle-size.mjs"
    policy: upstream_wins
    note: |
      Both sides raise chunk budgets. Upstream's number is the FRESHER
      measurement against a bigger tree, so it is the safer ceiling — take it,
      then re-measure locally (analyze build) and only lower it if it is wrong.

  # ── generated: regenerate, never hand-merge ──
  - glob: "@(config-baseline|error-code-baseline).json"
    policy: upstream_then_regen
  - glob: ".github/black-baseline.txt"
    policy: upstream_then_regen
  - glob: "website/src/components/commandPalette/settingsRegistry.gen.ts"
    policy: upstream_then_regen

  # ── structure churns upstream: take theirs, re-apply fork fixes ──
  - glob: "src/kiro_crew/dashboard/**"
    policy: upstream_wins
    note: "Re-apply fork messaging/approval fixes on top."
  - glob: "src/kiro_crew/apps/builtins/**"
    policy: upstream_wins

  # Remaining first-party modules with no recorded fork divergence: upstream's
  # version is authoritative. If a resolution here turns out to need judgment,
  # promote the path to its own rule above rather than deciding it twice.
  #
  # READ THIS BEFORE RESOLVING A BATCH. `upstream_wins` means upstream's version
  # is the BASE and the fork's own delta is then RE-APPLIED on top. It does NOT
  # mean `git checkout --theirs`. At the 997be5f4a sync that shortcut was taken
  # across 68 paths at once and silently dropped fork work in EVERY one of them --
  # `git diff <prev upstream base> main -- <path>` was non-empty for all 75 paths
  # resolved that way, including +1176 lines of durable run-coordinator behaviour
  # in subagent.py and the whole ACP catalog in the i18n locales. Nothing conflicts,
  # nothing errors; the loss only surfaces if a pinned test happens to cover it.
  # Recovery, if it happens again: `git checkout -m -- <path>` re-presents the
  # original conflict, so the batch can be resolved properly without redoing the
  # merge. Resolve these one subsystem at a time and diff each against the fork
  # parent afterwards.
  - glob: "src/kiro_crew/**"
    policy: upstream_wins
  - glob: "website/src/**"
    policy: upstream_wins
    note: "Keep fork-only i18n/glossary additions (union within this policy)."
  - glob: "test/**"
    policy: upstream_wins
    note: |
      EXCEPT a test pinning a fork divergence (see divergences below) — that
      failure is the test doing its job; update the expected value, keep the
      assertion.

  - glob: "docs/**"
    policy: union
  - glob: "*.md"
    policy: union

  - glob: "website/electron/package.json"
    policy: fork_wins
    note: "Fork keeps its own version cadence (matches CHANGELOG.md)."

  - glob: "src/kiro_crew/fork_version.py"
    policy: fork_wins
    note: |
      Fork-only module; upstream has no counterpart, so a sync should never
      touch it. See divergences/fork-version-identity for why `__version__`
      itself stays UPSTREAM's literal instead of moving here.

  - glob: "src/kiro_crew/release_channel.py"
    policy: union
    note: |
      Take upstream's channel rules, but KEEP the `strip_local()` call in
      `channel()`. Without it the unanchored `(?:a|b|rc)\d+` matcher reads a
      fork build's `+fork.g<sha>` as a prerelease segment for most commit
      hashes — hash-dependent, so it goes red intermittently or not at all.
      Pinned by test/test_fork_version.py.

  # ── the desktop shell: upstream is extracting main.js into siblings ──
  - glob: "website/electron/main.js"
    policy: upstream_wins
    keystone: true
    note: |
      Upstream is dissolving this monolith into the siblings already beside it
      (gateway-supervisor.js, window-lifecycle.js, ipc-registrar.js, app-menu.js,
      …). It went 4463 -> 464 lines in one sync, so the whole file conflicts and
      the fork side is a 4000-line stale snapshot: NEVER resolve toward it, or a
      sync silently un-does the extraction. Take upstream's file whole, then
      re-derive the fork's own hunks with `git diff <prev base> main -- <path>`
      and PORT each one into the sibling that now owns that behaviour — a hunk
      left in main.js parses and never runs. Keystone because that port is
      judgment: the fork's tray gateway controls belong in window-lifecycle.js
      (tray) plus gateway-supervisor.js (state), not here.
  - glob: "website/electron/@(window-lifecycle|gateway-supervisor|ipc-registrar).js"
    policy: upstream_wins
    note: |
      Extraction targets for the main.js hunks above; they are upstream-authored
      and churn every sync. A fork behaviour ported in must be ADDITIVE and
      OPTIONAL at the seam (see divergences/desktop-tray-gateway-controls), so
      upstream's own structure keeps merging cleanly next time.

  - glob: "src/kiro_crew/@(security|sandbox).py"
    policy: upstream_wins
    keystone: true
    note: |
      Upstream churns both heavily and is actively TIGHTENING the deny gate, so
      take its file whole. Then re-add the fork's seams (see
      divergences/workflow-policy-keystone-opt-ins), which are small and easy to
      lose in a 5-figure-line merge:
        security.py  `_git_publication_floor_applies()`; the
                     `if publish_sources and not _git_publication_floor_applies()`
                     branch in `is_denied`; the empty-set return in
                     `floor_enforced_builtin_command_ids()`; the
                     `workflow_policy.json` leaf in `_CREW_SECRET_LEAVES`.
        sandbox.py   `_sensitive_env_prefixes()` and `_spawn_scrub_env_prefixes()`
                     (upstream has a module-level `_SPAWN_SCRUB_ENV_PREFIXES`
                     constant -- the fork needs the FUNCTION, or the ssh opt-in
                     silently needs a restart on that one path).
      Losing a seam fails in the SAFE direction (the floor re-applies, the socket
      is scrubbed), so it will not show up as a security incident -- it shows up
      as the operator's workflow breaking again. `test/test_workflow_policy.py`
      is what catches it; run it after every sync.

  - glob: "src/kiro_crew/acp/client.py"
    policy: upstream_wins
    keystone: true
    note: |
      9k+ lines, upstream rewrites it constantly. Take upstream whole, then
      re-add the fork's parked-permission mechanism (see
      divergences/permission-argument-race-park): the three helpers next to
      `_build_permission_event`, the two module/instance state declarations, and
      the FIVE call sites inside `_dispatch_events` (per-turn clear, park on the
      permission branch, release after the refinement, flush on `complete`,
      flush before `_raise_acp_error`).

      Losing the flush call sites is the dangerous half and it fails LOUD in the
      worst way: the agent blocks forever on an unanswered JSON-RPC request
      instead of getting a deny. Losing the park is merely a regression to the
      old behaviour. `test/test_permission_argument_race.py` covers both --
      run it after every sync, and check upstream PR #6777 first, which may
      supersede the whole divergence.

  - glob: "website/electron/auto-update.js"
    policy: upstream_wins
    keystone: true
    note: |
      Upstream owns the whole updater; the fork adds exactly one thing —
      `readForkRevision()` plus the `disabled: "fork"` gate that runs after the
      externally-managed block and before the dev-build gate (see
      divergences/fork-electron-updater-suppression). Take upstream's file whole,
      then RE-ADD those two hunks. Keystone because losing them is silent and
      catastrophic in one direction: the app quietly downloads an upstream
      release and offers to install it over the fork. After any sync, assert the
      gate is back by running `node --test website/electron/test/auto-update.test.js`
      — the fork tests there fail loudly if it is gone.

  - glob: "website/electron/test/*.js"
    policy: upstream_wins
    note: |
      Upstream retargets these at the module it just extracted (the tray
      assertions moved from MAIN_JS to WINDOW_LIFECYCLE_JS). Its version knows
      where the code went; the fork's does not. Take upstream, then re-point any
      fork-only assertion at the new module rather than keeping the old target.
      A pinned export/key LIST here is expected to go red when the fork adds a
      seam — extend the list, do not delete the assertion.

  # ── screenshot capture harnesses: upstream's copy is the fresher one ──
  - glob: "website/scripts/capture-*.mjs"
    policy: upstream_wins
    note: |
      Both sides ADD the same path when a UI change needs evidence, so these
      surface as AA conflicts rather than UU. In every case measured so far
      upstream's file is a strict superset — byte-identical prologue plus the
      extra captures its later work needed. Diff the two before assuming it:
      take upstream, then port any capture the fork has and upstream lacks.

divergences:
  - id: fork-version-identity
    what: |
      `__version__` stays UPSTREAM's bare literal. The fork half rides a PEP 440
      LOCAL segment (`+fork.g<sha>[.dirty]`), derived from git and composed by
      `kiro_crew.fork_version.full_version()` for display surfaces only.
    why: |
      A fork build was indistinguishable from the upstream build it forked, and
      an upstream install one minor ahead read as NEWER. Rewriting `__version__`
      would have decoupled the changelog gate, the promotion contract, the
      release feed comparison and the desktop updater's compare gate from the
      artifacts they describe — so the fork identity goes somewhere those
      parsers ignore. Every classifier and comparator strips the local segment
      first (`fork_version.strip_local`), and the release feed does not offer a
      fork build an upstream artifact, because applying one REPLACES the fork.
    pinned_by: "test/test_fork_version.py, test/test_fork_update_suppression.py"
    decided: 2026-09-04

  - id: fork-electron-updater-suppression
    what: |
      `website/electron/auto-update.js` refuses to arm electron-updater when the
      bundle's baked `FORK_REVISION` is non-empty: `initAutoUpdate` returns
      `disabled: "fork"` before the feed is ever configured, and About renders a
      named reason for it.
    why: |
      The Python release-feed check and the Electron auto-updater are TWO
      INDEPENDENT LANES, and suppressing only the first left the second live: a
      fork install downloaded upstream 0.5.0 in the background and offered
      "Install Update & Restart App", which would have overwritten the fork's own
      bytes with a different product. No version string can express "not on your
      lane" — the artifact is a different line of descent — so the refusal is
      structural and ahead of arming. The revision is read from the Python stamp
      (`kiro_crew/_build_info.py`) rather than a marker of the updater's own, so
      the two lanes cannot disagree about whether this is a fork.
    pinned_by: "website/electron/test/auto-update.test.js, website/src/test/AboutPanel.disabledReasons.test.tsx"
    decided: 2026-09-05

  - id: workflow-policy-keystone-opt-ins
    what: |
      `src/kiro_crew/workflow_policy.py` plus the keystone
      `<config dir>/workflow_policy.json` (on `security._CREW_SECRET_LEAVES`)
      carry two operator opt-ins upstream does not have:
      `git_publication_mode: protected|repository_governed` retires the
      verb-anchored git-publication floor in favour of the remote host's
      rulesets and branch protection, and `forward_ssh_agent` drops
      `SSH_AUTH_SOCK` from the sandbox scrub set.
      A THIRD key `allow_external_handoff` gates
      divergences/external-agent-handoff. Enforcement seams:
      `security._git_publication_floor_applies()`,
      `security.floor_enforced_builtin_command_ids()`,
      `sandbox._sensitive_env_prefixes()` / `_spawn_scrub_env_prefixes()`, the
      `/api/security/workflow-policy` handlers, and `WorkflowPolicyCard` in
      `SecurityPanel.tsx`.
    why: |
      Upstream's floor denies a bare `git push` and any push to
      main/master/mainline, un-disableably, and scrubs `SSH_AUTH_SOCK` in every
      sandbox mode. On a repo whose publication controls already live at the
      remote, that is path-dependence rather than protection — the boundary
      becomes the command's spelling — and the ssh scrub makes an ssh remote or
      an ssh-signed commit impossible from inside the sandbox. Both are open
      upstream requests with no implementation: kirodotdev/KiroCrew#5629 and
      #8104. If either lands upstream, PREFER the upstream mechanism and retire
      this one rather than carrying both.

      BOTH values widen what the agent may do, which is why they live on a
      keystone the agent cannot read or write rather than in `config.json`, why
      every read fails soft to the restrictive position, and why both predicates
      test strict equality instead of truthiness.
    pinned_by: "test/test_workflow_policy.py, website/src/pages/settings/SecurityPanel.workflowPolicy.test.tsx"
    decided: 2026-09-05

  - id: permission-argument-race-park
    what: |
      `acp/client.py` PARKS a `session/request_permission` that is classified as
      shell but whose arguments have not streamed yet, releases it once the
      `tool_call_update` refinement writes the provenance caches, and flushes
      anything still parked on the `complete` / `error` exits.
      Seams: `_MAX_PARKED_PERMISSIONS`, `self._parked_permissions`,
      `_park_unverified_permission`, `_release_parked_permission`,
      `_flush_parked_permissions`, plus five call sites inside
      `_dispatch_events`.
    why: |
      opencode announces a tool call before its arguments finish streaming, so
      `hooks.py`'s `is_shell and not command` deny-by-default backstop refused
      every shell call from it. Measured: three SEL events one millisecond apart
      (`denied`, `refined`, `refined`) while the persisted tool input carried the
      full `{"command": ...}` the whole time, and `security.is_denied()` returns
      None for that command -- nothing about it was actually disallowed.

      That refusal is correct and deliberately has NO override: `ToolHookResult`
      carries only allow / auto_approve / deny, so a suppression could at best
      return `allow`, which a downstream YOLO or trust tier would then
      auto-grant. Upstream's own comment names the right fix -- "the fix belongs
      in recognizing the payload shape, not in admitting commands no gate read"
      -- so this defers the READ rather than weakening the verdict. A request
      whose arguments never arrive is still denied.

      Modelled on upstream PR #9053 (issue #9024), which fixes the sibling case
      (KAS sends no `tool_call` frame at all) and establishes the two rules this
      follows: read the truth off the payload rather than a cache, and never let
      a waiver turn a hard deny into an auto-approve. That PR does NOT fix this
      case, and no upstream issue covers it.
    pinned_by: "test/test_permission_argument_race.py"
    decided: 2026-09-07

  - id: upstream-owned-harnesses
    what: |
      claude, codex and opencode are UPSTREAM's harnesses: the spawn chain in
      `acp/client.py`, `harness/`, `agent_sdk/backends.py` and the frame corpora
      under `test/fixtures/acp_frames/` are taken from upstream verbatim at every
      sync. The fork's own adapters for the same three ids -- `acp/claude.py`,
      `acp/codex.py`, `acp/opencode.py`, `acp/tool_gate.py` and their tests
      (`test_acp_codex_models_and_agents.py`, `test_acp_backend_opencode_pi.py`'s
      opencode half) -- are RETIRED, pending deletion in the follow-up after the
      2026-09-15 sync lands.
    why: |
      Upstream #10006 shipped OpenCode and #10449 the codex `model[effort]` pick,
      doing what the fork's adapters did their own way. The operator's rule for
      this fork: use upstream wherever upstream has it, keep fork code only for
      what upstream lacks. Carrying both was how two opencode identities ended up
      in one `ACP_BACKENDS_*` set with different capability memberships.

      Concretely at the 2026-09-15 sync: the handler-side codex effort split
      (`_codex_selection_effort`, `codex.wire_model_id`) went, because upstream
      splits inside `AcpClient.set_model` (`_push_model_via_effort_split`); the
      `_wire_model_id` spec-adapter branch went, because `to_acp_id` passes an
      advertised id through unchanged; `select_provider_backend` lost its
      Kiro-dialect narrowing, because upstream serves codex/opencode through the
      same `AcpProvider`. The fork keeps ONLY: `copilot`, `goose`, `pi`
      (divergences/fork-adapters-without-corpus), the `explicit` arm on
      `select_provider_backend` (divergences/member-backend-explicit-arm) and the
      registry-merged `/api/acp-backends` row
      (divergences/acp-backends-registry-merged-route).
    pinned_by: "test/test_acp_client.py (upstream classes), test/test_harness_parity.py, test/test_agent_sdk_capabilities.py"
    decided: 2026-09-07
    revised: 2026-09-15

  - id: external-agent-handoff
    what: |
      An agent running OUTSIDE Kiro Crew starts a trackable session here:
      `dashboard/handoff.py` (the chokepoint), `POST /api/chat/handoff`, the
      `session_handoff` MCP tool in `mcp_tools/control.py`, the
      `kirocrew handoff` CLI twin, the `handoff_origin` field on the serialized
      slot, and a third keystone opt-in `allow_external_handoff` in
      `workflow_policy.json` (default OFF).
    why: |
      Upstream asks for this in two halves and has implemented neither:
      kirodotdev/KiroCrew#7697 (an entry point an external agent can call, whose
      run must appear as a real trackable session) and #7797 (finding
      non-dashboard sessions in the dashboard, for kiro-cli). The operator wanted
      Claude Code and OpenClaw work continuable in Kiro Crew; handing the WORK
      over is the clean half of that, because importing another tool's transcript
      would need a new read-only slot kind and could never actually continue.

      Both clients reach it through one door: they are MCP clients, so
      `kirocrew mcp-core` in their own `mcpServers` config is the whole
      integration. No per-tool adapter.

      Security shape, all deliberate:
        * identity is NOT resolved -- an external caller has none, and creating a
          session rather than targeting one is what makes that safe;
        * the slot is app-owned (`handoff:<origin>`), so it lands on the
          unattended path: deny-fast approval window plus the background-turn cap;
        * it gains NO approval authority. Auto-approve sources stay slot trust or
          YOLO only (see divergences/auth-grant-sources). This must never become
          a third source;
        * `KNOWN_ORIGINS` is closed because the value is persisted, rendered in
          the sidebar, and interpolated into the provenance line the model reads.

      If #7697 lands upstream, PREFER its entry point and retire this one rather
      than carrying both.
    pinned_by: "test/test_handoff.py, website/src/pages/settings/SecurityPanel.workflowPolicy.test.tsx"
    decided: 2026-09-08

  - id: auth-grant-sources
    what: "Only explicit slot trust or global YOLO auto-approves a tool call."
    why: |
      Upstream treated `approval_mode: "auto"` (the DEFAULT) as an unconditional
      grant, silently auto-approving every tool call on a fresh install. Removing
      configured_auto_approve was a security fix, not a preference.
    pinned_by: "test/test_promise_only_autoapprove_parity.py, test/test_unattended_slot_guardrails.py"
    decided: 2026-08-28

  - id: protected-branches
    what: "security._PROTECTED_BRANCHES = {main, mainline, master}"
    why: |
      An earlier session cleared this to set() with the comment 'agent is trusted
      to push to any branch'. It broke 9 pinned tests and the AGENTS.md
      keep-generic-security-controls invariant. Reverted; do not re-clear.
    pinned_by: "test/test_push_branch_gate.py, test/test_security.py"
    decided: 2026-08-23

  - id: copilot-selectable
    what: "The fork ships copilot as selectable IN ADDITION TO upstream's set."
    why: |
      The fork's core resolves and spawns `copilot --acp` directly and it was
      driven end to end here, so a build that serves it must let an operator
      select it.

      NARROWED at the 2026-09-15 sync (was `opencode-copilot-selectable`):
      opencode is upstream's now (divergences/upstream-owned-harnesses), so the
      remaining divergence is purely additive -- upstream {kiro, kas, claude,
      codex, opencode} plus the fork's {copilot}. `BASELINE_SELECTABLE_BACKENDS`
      stays DERIVED as `ACP_BACKENDS_KNOWN - NOT_SHIPPED_SELECTABLE`, and
      `NOT_SHIPPED_SELECTABLE` is {goose, pi}: each has no install probe in
      `agent_sdk/backend_install.py`, so its readiness verdict is UNKNOWN with
      nothing an operator could act on. codex left that set when upstream gave
      it a probe.

      The fork's `ACP_BACKENDS_MODEL_NAMESPACE` adds copilot beside upstream's
      {kiro, kas}; every other capability set is upstream's, copilot opts into
      none of them.
    pinned_by: "test/test_harness_parity.py::test_initial_adapter_selection_is_limited_to_reviewed_backends, test/test_agent_backend_editable.py::test_baseline_ships_the_reviewed_backends_only, test/test_agent_sdk_capabilities.py (KNOWN list), test/test_provider_dispatch.py::TestKiroDialectSet"
    decided: 2026-08-31
    revised: 2026-09-15

  - id: copilot-backend-identity
    what: "is_copilot_backend predicate + 'copilot' in session_pid._MANAGED_AGENT_MARKERS."
    why: |
      Any backend the fork admits beyond upstream's set needs BOTH: a positive
      identity predicate (harness parity H5) and a process marker, or its
      processes become unreapable orphans. The marker was missed once already.
    pinned_by: "test/test_acp_backend_kas.py::test_exactly_one_predicate_holds_for_every_known_backend, test/test_acp_backend_labels.py::TestManagedAgentMarkers"
    decided: 2026-08-31

  - id: fork-adapters-without-corpus
    what: |
      copilot, goose and pi have no recorded frame corpus under
      `test/fixtures/acp_frames/`, no rows in the host-contract bucket tables
      (`docs/system-specs/modules/agent-host-contract.md` reads `—` for them),
      and `test_acp_frame_replay.py::test_every_known_backend_has_fixtures` names
      them out explicitly.
    why: |
      Upstream's replay ratchet requires a corpus per `ACP_BACKENDS_KNOWN` id.
      None of the three has been captured against a live host here, and a
      fabricated .jsonl would pin nothing real. The exemption is a named set, not
      a filter, so the gate still fails the moment a NEW id lands without one.
      Capture a corpus (`scripts/update_acp_frame_snapshots.py` after recording)
      and delete the id from the set in the same change.
    pinned_by: "test/test_acp_frame_replay.py::test_every_known_backend_has_fixtures"
    decided: 2026-09-15

  - id: registry-mirror-projection
    what: |
      `providers/mirrors/registry.py` PROJECTIONS carries a `McpProjection` for
      copilot, goose and pi (`kind=NO_CHANNEL`, tracking
      `docs/request-for-change/rfc-agent-config-mirror.md#5-migration`).
    why: |
      Upstream's registry requires every known id to declare how Crew's MCP
      servers reach it; a missing entry fails at import. NO_CHANNEL is the
      truthful answer until one of these adapters grows an MCP channel. Add the
      row beside the id, never widen the set the registry iterates.
    pinned_by: "test/test_provider_mirrors.py"
    decided: 2026-09-15

  - id: registry-adapter-vocabulary
    what: |
      `agent_sdk/backends.py` declares `ACP_BACKENDS_REGISTRY_ADAPTERS =
      {copilot, goose, pi}` (driver-internal disposition): the ids
      `members._direct_factory_backend` degrades to kiro when the direct Kiro
      provider factory is the caller -- their dialect-correct route is the
      registry dispatcher, not `AcpProvider`. Upstream's own harnesses (kiro,
      kas, claude, codex, opencode) are never members and pass through
      unnarrowed. Session MCP composition does NOT read this set (see
      divergences/mcp-injection-composition): the gate there is `self._is_kiro`,
      applying to every non-kiro backend upstream's and this build's alike, not
      to this narrower registry-adapter membership.
    why: |
      Giving the provider-factory narrowing a named set (rather than an inline
      backend-id check) is what keeps it legible on its own, and matches the
      shape `host_auth.py` uses to declare sign-in for the same three ids (no
      credential leaf -- none has been verified on disk here, see
      divergences/fork-adapters-without-corpus).
    pinned_by: "test/test_agent_sdk_capabilities.py, test/test_provider_dispatch.py::TestAcpBackendOverride, test/test_agent_sdk_host_auth.py::test_every_known_harness_has_a_declaration"
    decided: 2026-09-15

  - id: acp-backends-registry-merged-route
    what: |
      `GET /api/acp-backends` is served by the fork's
      `dashboard/handlers/acp_backends.py` (registry half: label, dialect,
      routing, capabilities, degraded_count, selectable) merged with the machine
      half from upstream's `acp_backend_status._snapshot()`, reached through the
      fork's `install_snapshot()` wrapper appended to that upstream module. The
      merged row carries upstream's `auth` object too.
    why: |
      Upstream registers `api_acp_backend_status` on the same path with only the
      machine half; the fork's overview `AcpBackendCard` reads the registry half.
      aiohttp answers from the FIRST registration, so both halves must come from
      one handler on one route (`test_dashboard_route_table.py` pins uniqueness).
      Take upstream's `_snapshot()` changes verbatim -- the wrapper is a keyed
      view of its rows, never a second probe.
    pinned_by: "test/test_dashboard_route_table.py::test_acp_backends_resolves_once_and_serves_both_halves, test/test_acp_backends_endpoint.py, test/test_agent_sdk_backend_install.py::TestInstallSnapshot"
    decided: 2026-09-15

  - id: member-backend-explicit-arm
    what: |
      `members.select_provider_backend(explicit, session_key, member_backend,
      configured_default)` -- one arm ahead of upstream's three, because the
      fork's `create_provider_factory` passes the caller's `acp_backend` pick.
      Every arm crosses `_direct_factory_backend`, which degrades to kiro ONLY
      an id in `ACP_BACKENDS_REGISTRY_ADAPTERS` (divergences/
      registry-adapter-vocabulary) -- upstream's own harnesses (kas, claude,
      codex, opencode) pass through unnarrowed, since upstream already serves
      them through the direct `AcpProvider` factory.
    why: |
      Upstream's factory takes no per-call backend. The fork's old
      `_kiro_dialect_only` narrowing degraded EVERY spec-dialect id, which
      silently broke the private-member refusal for codex once codex became
      upstream's (a spec-dialect id `AcpProvider` now serves directly). Scoping
      the narrowing to the fork's own registry-adapter set fixes that without
      giving up the degrade this build's copilot/goose/pi still need. Upstream
      tests call the three-arg form; adapt them by passing `None` first, not by
      dropping the arm.
    pinned_by: "test/test_member_dispatch_mount.py::TestSelectProviderBackend, test/test_member_memory_auth.py::test_private_execution_requires_direct_mcp_tools, test/test_provider_dispatch.py::TestAcpBackendOverride"
    decided: 2026-09-15

  - id: durable-run-coordinator
    what: |
      `src/kiro_crew/run_coordinator/` (models, sqlite, shadow, delivery, recovery,
      memory, legacy) plus its wiring in `subagent_manager/`: `_coordinator_fence`,
      `_coordinator_mark_running`, `_coordinator_record_process`,
      `_commit_terminal_event`, `_outbox_live_contexts`, `_ack_delivery_for_run`,
      `_finalize_queued_cancel`, and `_unqueue` returning a LIST rather than one
      entry (the queue cancel commits each rejection durably, one at a time).
    why: |
      rfc-durable-run-coordinator PRs 1-4 are implemented HERE and nowhere upstream:
      upstream keeps that RFC at `draft` with nothing on main. The eight modules do
      not conflict — upstream has no file of those names — so a sync preserves them
      automatically and then silently cuts the WIRING, because every call site sits
      in a file upstream also edits. The modules stay, nothing errors, and the runs
      stop being recorded.

      Two shapes to watch at every sync: an upstream rewrite of a
      `subagent_manager/` method that drops the `_coordinator_*` call beside it,
      and any change that narrows `_unqueue` back to `dict | None` — upstream's
      `cancel_for_parent_impl` is written against that narrower contract, so it
      must be adapted to the list, never the other way round.

      The RFC status row in docs/request-for-change/README.md describes THIS tree,
      so upstream's "draft / Nothing" row is wrong here and must not be taken.
    pinned_by: "test/test_run_coordinator_sqlite.py, test/test_run_coordinator_delivery.py, test/test_run_coordinator_recovery.py, test/test_subagent_command_authority.py"
    decided: 2026-09-14

  - id: mcp-injection-composition
    what: |
      Crew's managed MCP servers reach EVERY non-kiro backend (upstream's
      claude/codex/opencode included, not just this build's copilot/goose/pi)
      through ONE tool-gate-gated call, `_gated_session_mcp_servers()`, which
      merges upstream's `_session_mcp_servers()` (sync, cache-backed base
      array) with `_spec_session_mcp_delivery()`'s tool-gate-approved managed
      servers and the pooled broker stubs. Upstream's own wire splat --
      `*(self._claude_session_mcp_servers() if self._is_claude else []), ...`,
      each guarded only by its own `self._is_<harness>` check -- is REPLACED at
      both `_new_session_following_substitution` and `_initialize_session` by
      `[] if self._is_kiro else await asyncio.to_thread(self._gated_session_mcp_servers)`.
      The three named per-harness accessors (`_claude_session_mcp_servers` etc.)
      still exist, unchanged, as directly-callable seams for the MCP ref guard
      and other unit tests that need the raw ungated array -- they are simply no
      longer spliced onto the wire.
    why: |
      Upstream has no tool-gate concept here at all: a claude or codex session
      with an unproven permission route still gets the full managed array.
      This build's tool-gate hard floor (`_spec_session_mcp_delivery`) predates
      that and is unconditional across every spec-dialect backend it drives,
      copilot/goose/pi included -- narrowing it to only the fork's OWN adapters
      during the 2026-09-15 sync was caught by `test_acp_spec_mcp_delivery.py`
      and `test_acp_spec_mcp_tools.py` (both fork-owned, parametrized over
      codex/goose/pi/kiro) failing on the newly-ungated claude/codex/opencode
      path; the fix widens the gate rather than narrowing the tests.

      kiro stays spec-free (--agent loads its own, injecting would double-launch);
      pooled stub outranks spec entry; fail-soft on malformed spec. Must COMPOSE
      with upstream's acp/spec_servers.py, never duplicate it. The pooled roster
      goes over VERBATIM for a runtime backend with nothing managed (KAS) --
      test_acp_harness_wire_parity pins that upstream never reshapes it.
    pinned_by: "test/test_acp_spec_mcp_delivery.py, test/test_acp_spec_mcp_tools.py, test/test_acp_runtime.py (builder-consultation guard), test/test_acp_harness_wire_parity.py, test/test_harness_parity.py::test_each_mcp_seam_is_spliced_only_for_its_own_harness"
    decided: 2026-08-29
    revised: 2026-09-15

  - id: connections-disconnect-owner-gate
    what: "api_connections_disconnect requires require_owner_dashboard_request."
    why: |
      It deletes stored OAuth grant artifacts. Its sibling mint endpoint was
      gated; this one was not, so a non-owner could trigger revocation.
    pinned_by: "test/test_agent_config_owner_gate_invariant.py::test_every_gated_route_refuses_non_owner"
    decided: 2026-08-31

  - id: de-amazoned
    what: "No Brazil, CodeArtifact, SSO, MCS, enterprise auth, internal markers."
    why: "Public OSS fork. Re-introducing any of it is a publish-safety failure."
    pinned_by: "scripts/scrub-lint.sh (CI: De-Amazon Scrub Lint)"
    decided: 2026-08-19

  - id: desktop-tray-gateway-controls
    what: "The tray menu shows a live Gateway status label plus Start/Stop/Restart."
    why: |
      Fork feature (07ad84b5d). It lived in main.js, which upstream has since
      extracted, so the sync that slims main.js is exactly when it disappears
      with no conflict marker. Now split the way upstream's structure wants:
      gateway-supervisor.js owns controlState/runControlAction/observeState,
      window-lifecycle.js renders the items, main.js only wires the two. The
      OPTIONAL `gatewayControls` option is load-bearing — absent, createTray
      renders upstream's exact pre-feature template.

      Two upstream invariants this must not trample: stopGatewayGracefully
      deliberately KEEPS "spawned" ownership so a failed update install may
      respawn, so `running` is derived from the live child plus adopted
      ownership rather than from gatewayOwnership alone; and the observer is
      notification-only, wrapped so a throwing tray callback cannot break boot.
    pinned_by: |
      website/electron/test/gateway-supervisor.test.js (controlState/observeState/
      runControlAction), website/electron/test/hide-to-tray.test.js::"keeps the
      fork's gateway controls on the tray menu"
    decided: 2026-09-04

  - id: signed-bundle-bytecode-floor
    status: scoped
    what: "SCOPED — -B is retired where PYTHONPYCACHEPREFIX reaches the child, and RETAINED where it cannot."
    why: |
      Introduced by fork commit d82fd1a4b as a blanket interpreter-level `-B` on
      every bundled Python entry point, to stop __pycache__ appearing inside the
      signed macOS bundle after environment scrubbing.

      At the 2026-09-04 sync an operator decision adopted upstream's redirect as
      the OWNER of bytecode policy: `website/electron/gateway-env.js`
      `gatewayBytecodeEnvironment()` REDIRECTS the cache rather than forbidding
      writes (faster warm start), pointing PYTHONPYCACHEPREFIX at
      `<kirocrewDir>/cache/pycache` on POSIX and setting it to "" on PACKAGED
      WINDOWS so CPython consumes the build-time caches
      `packaging/precompile_windows.py` ships beside the bundled modules.

      The blanket `-B` was removed first, then measurement showed the redirect
      does not reach every child, so the floor was RESTORED on exactly the spawns
      it cannot reach. THIS ENTRY IS THEREFORE NOT FULLY RETIRED. A future sync
      must read the two halves separately:

      HALF 1 — prefix-reachable: `-B` is RETIRED and must NOT come back. `-B` is
      an interpreter-level flag no environment variable can lift, so a surviving
      `-B` on a child that inherits the prefix silently defeats the warm start
      for that path only. Do not re-add it there, and do not read its absence as
      an upstream regression. Sites that gave it up permanently (`-s` is a
      separate no-user-site-packages concern and stays everywhere):
        * packaging/build-desktop.sh — POSIX launcher and the Windows
          `kirocrew.cmd` shim.
        * website/electron/main.js / gateway-supervisor.js — already on
          upstream's side before the decision.

      HALF 2 — env-unreachable: `-B` is RETAINED and is a FORK BEHAVIOUR AN
      UPSTREAM SYNC MUST NOT DROP. `-I` (isolated) implies `-E`, so such a child
      ignores every `PYTHON*` variable including PYTHONPYCACHEPREFIX; a child
      spawned with `strip_python_env=True` never receives it at all. There the
      redirect is INERT and CPython falls back to its default location — beside
      the bundled sources inside the code-signed `.app`. Every one of these is a
      short-lived one-shot probe, helper or supervisor that gains nothing from a
      bytecode cache, so the retained floor costs none of the warm start the
      operator chose. Sites that KEEP `-B` (all `-I`, some also env-stripped):
        * src/kiro_crew/sandbox.py — `_PROBE_SHIM_CODE` namespace probe,
          `_SPAWN_SHIM_CODE` post-exec shim, and `_LAUNCHER_INTERPRETER_FLAGS`
          (the Linux namespace launcher, also reached with strip_python_env=True).
        * src/kiro_crew/validation.py — the bounded ReDoS pattern child.
        * src/kiro_crew/kiro_prerequisite.py — the POSIX process-group
          supervisor (this spawn is BOTH `-I` and strip_python_env=True).
        * src/kiro_crew/platform_compat.py — the interpreter-version probe.
        * src/kiro_crew/dep_sync.py — `_probe_interpreter`.
        * src/kiro_crew/platform/wheel_engine.py — the shadow-tree version probe.
        * src/kiro_crew/apps/builtins/dev_fleet/worktree_ops.py — the dependency
          preflight snapshot and the sync-runner bootstrap.
        * src/kiro_crew/agent.py — BOTH interpreter shapes of
          `_kirocrew_mcp_invocation` (the `sys.executable -m kiro_crew` fallback
          and the Windows `.cmd`→`python.exe` unwrap). Not `-I`, but the
          managed-server probe / pooled-backend spawn in
          `mcp_discovery.probe_server` goes through
          `sandboxed_spawn_argv_async(..., strip_python_env=True, ...)`, which
          removes every `PYTHON*` key, so the redirect is inert for that child
          and CPython falls back to `__pycache__` beside the bundled sources in
          the signed `.app`. A kiro-cli-spawned managed server DOES inherit the
          prefix and merely skips writing bytecode — one import-time parse, paid
          on the path that cannot be told apart from the probe because both read
          the same single-source-of-truth argv. That argv is compared by EQUALITY
          for the `first_party_fixed_argv` carve-out, so the flag must stay in
          `_kirocrew_mcp_invocation` alone; `mcp_discovery`'s refusal of the
          CWD-shadowable `-m kiro_crew` fallback is keyed on the FLAGS
          (`_module_invocation_without_safe_path`, `-P` absent) rather than an
          `args[:2]` prefix, so a prepended `-B` cannot silently widen it.

      The canonical prose statement of the rule lives beside
      `sandbox._LAUNCHER_INTERPRETER_FLAGS`; every other site carries a
      three-line pointer to it.

      STILL UNCOVERED after this change: a Python that is neither prefix-reachable
      nor flag-carrying. In practice that is a bare shell `kirocrew ...` through the
      bundled POSIX launcher (`-s -m kiro_crew`, no `-B`, and no gateway env because
      the Electron shell is not in the chain), which can still write __pycache__ into
      the bundle — and, for the same reason, the standalone-console-script shape of
      `_kirocrew_mcp_invocation` (`kirocrew <sub>`), which is that launcher and
      accepts no interpreter flags. That is the operator-accepted residue of choosing
      the redirect:
      closing it would require re-adding `-B` to the launcher, i.e. reverting
      HALF 1. Also out of scope on purpose: `pptx_maker`'s
      provision/engine spawns, which run a managed `uv` tree outside the bundle
      rather than the bundled interpreter.
    pinned_by: "test/test_build_desktop_launcher_symlink.py::test_bytecode_policy_is_scoped_by_whether_the_prefix_can_reach_the_child (pins BOTH halves: gatewayBytecodeEnvironment is the owner the gateway spawn reads and no prefix-reachable entry point re-adds -B; and every list/tuple literal under src/kiro_crew carrying \"-I\" must also carry \"-B\", found by ast so a new isolated spawn cannot land without it), website/electron/test/gateway-env.test.js, test/test_agent.py::TestKirocrewMcpInvocation (both interpreter shapes carry -B), test/test_mcp_discovery.py::TestFirstPartyManagedArgv::test_a_prepended_flag_does_not_smuggle_the_fallback_past_the_refusal + ::test_a_freshly_resolved_invocation_still_compares_first_party (the equality carve-out survives the flag without being loosened)"
    decided: 2026-09-04
    revised: 2026-09-04

  - id: fork-ux-removals
    what: "Channels app hidden from the App Store; Board app removed."
    why: "Deliberate fork UX divergence; an upstream sync must not restore them."
    pinned_by: "test/test_apps_registry_coverage.py::TestForkUxRemovalsSurviveAnUpstreamSync"
    decided: 2026-08-19
    note: |
      Carried UNPINNED through several syncs and survived each one by luck. Pinned
      at the 997be5f4a sync after verifying the assertions actually go red when the
      divergence is reverted (channels `hidden` flipped to false -> the test fails).
      They read the packaged tree rather than going through `registry`, because what
      ships is what is on disk and the App Store grid reads `hidden` straight out of
      the manifest.

toolchain:
  python: ".venv/bin/python3"
  node: "npm"
  typecheck_extra_args: "--platform linux"   # AGENTS.md: CI types on Linux

gates:
  - name: "no conflict markers"
    run: "! git grep -n '^<<<<<<<' -- ':!*.md' ':!.fork-sync.yml'"
  - name: "black (baselined)"
    run: "{python} scripts/check_black_formatting.py"
  - name: "subprocess encoding"
    run: "{python} scripts/check_subprocess_encoding.py"
  - name: "harness parity"
    run: "HARNESS_BASE_REF=origin/{fork_branch} python3 scripts/check_harness_parity.py"
  - name: "brand name"
    run: "BRAND_BASE_REF=origin/{fork_branch} python3 scripts/check_brand_name.py"
  - name: "docs lint"
    run: "bash scripts/docs-lint.sh"

baselines:
  - path: "config-baseline.json"
    regen: "{python} scripts/generate_config_baseline.py"
  - path: "error-code-baseline.json"
    regen: "{python} test/test_error_code_contract.py --update"
  - path: ".github/black-baseline.txt"
    regen: "{python} scripts/check_black_formatting.py --update-baseline"
  - path: "website/src/components/commandPalette/settingsRegistry.gen.ts"
    regen: "cd website && npm run gen:settings"

tests:
  focused: "{python} -m pytest test/test_security.py test/test_harness_parity.py test/test_acp_backend_kas.py test/test_acp_backend_labels.py test/test_acp_backend_opencode_pi.py test/test_acp_spec_mcp_delivery.py test/test_agent_config_owner_gate_invariant.py test/test_promise_only_autoapprove_parity.py test/test_unattended_slot_guardrails.py test/test_push_branch_gate.py -q"
  full: "{python} -m pytest -q --timeout=180 -k 'not pty_integration'"
  frontend: "cd website && npx tsc -b && npm run build && npx vitest run --coverage=false"

known_red:
  - check: "Dependency License Gate"
    reason: "Dependency review needs the repo's Dependency graph enabled."
    fix: "Repo Settings → Code security & analysis → enable Dependency graph."
  - check: "Design Review / First Principles Review / GPT 5.6 Review / Opus 4.8 Review"
    reason: "Fork has no AWS Bedrock credentials; these gates fail CLOSED by design."
    fix: "Configure Bedrock OIDC/secrets, or exempt upstream-sync PRs from them."
  - check: "scripts/scrub-lint.sh — git-history scan"
    reason: |
      Flags ~1100 @amazon.com-authored commits already in history from earlier
      upstream syncs. Working-tree scan passes; only the history step fails.
    fix: "Not fixable without rewriting history. Read the working-tree result only."

environmental_failures:
  - pattern: "test/test_tailnet_e2e.py"
    reason: "Needs tailscale + network the runner denies; fails on the merge base."
  - pattern: "*@pty_integration"
    reason: "Known-flaky pty/websocket timeouts; fail on the merge base."
  - pattern: "test/test_ensure_python_symlink.py"
    reason: "dyld @rpath/libpython resolution in scratch venvs."
  - pattern: "test/test_stop_hook_continuation.py::TestRealHookProcess"
    reason: "Spawned hook exits rc=126 in this sandbox."
  - pattern: "test/test_deploy_web_profiles.py::test_create_aws_profile_writes_only_allowlisted_keys"
    reason: "shlex.split breaks on this checkout's space-containing path ('My Apps')."
  - pattern: "test/test_ci_surface_tests.py::test_explicit_cli_target_bypasses_collect_ignore"
    reason: "Asserts a pytest-version behavior; unrelated to Kiro Crew code."
  - pattern: "test/test_codex_session_mcp.py::test_the_real_adapter_guard_is_reachable_at_all"
    reason: |
      Spawns a REAL out-of-process node adapter driver; under xdist parallel
      workers a sibling worker's env (CODEX_ACP_BIN) leaks into this one's
      `os.environ` snapshot. Passes in isolation every time; fails under
      `-n auto`/`-n 6` intermittently. Not a logic bug in the adapter guard.
  - pattern: "website/src/i18n/style/hiStyle.test.ts"
    reason: |
      Ratchet ceiling vs actual violation count. Bumped 118→119 on 2026-08-31;
      bumped the punctuation ceiling (a separate assertion in the same file)
      30→31 on 2026-09-15 for one new upstream string
      (`apps.mdNotebook.connect.cloneHelp`). If either fails again the catalog
      grew — bump the ceiling, do not silence it.
  - pattern: "scripts/docs-lint.sh"
    reason: |
      A local `website/electron/backend-dist/` or `website/electron/dist/`
      desktop-build tree on disk (gitignored, never tracked) is scanned by
      docs-lint's citation check and reports dozens of "doc does not exist" and
      "line past end of file" findings against its bundled site-packages copy.
      Remove the build tree (or run docs-lint from a clean checkout) to see the
      real signal underneath. One genuinely pre-existing finding under that
      noise, predating this sync (already on fork `main`): "packaged docs with
      an unrecorded consumer" for `src/kiro_crew/docs/experimental-acp-adapters.md`
      (named in `website/src/pages/overview/AcpBackendCard.tsx` but never added
      to `CODE_COUPLED_DOCS` in `scripts/docs_lint.py`) -- register the pairing
      there in a follow-up, not part of this sync's scope.
